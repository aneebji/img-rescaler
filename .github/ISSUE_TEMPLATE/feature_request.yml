name: Feature request
description: Suggest a focused improvement to an image preparation workflow.
title: "[Feature]: "
body:
  - type: markdown
    attributes:
      value: |
        Describe the workflow you want to improve. Concrete examples help keep the workspace useful and focused.
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe who encounters it and when it occurs.
      placeholder: When preparing a product catalog, I need to...
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Explain what the app should do and what a successful outcome looks like.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives or current workaround
      description: Describe any existing way to complete the task and its limitations.
  - type: dropdown
    id: runtime
    attributes:
      label: Relevant experience
      options:
        - Browser and desktop
        - Browser
        - Desktop
        - Documentation or development
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add examples, sketches, accessibility considerations, or sample dimensions. Do not include sensitive data.
