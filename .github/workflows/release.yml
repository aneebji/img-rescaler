name: Desktop release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    name: Package (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            script: package:mac
          - os: windows-latest
            script: package:win
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Package desktop app
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npm run ${{ matrix.script }}
      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os }}
          path: |
            release/*.dmg
            release/*.zip
            release/*.exe
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish GitHub release
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          path: artifacts
          merge-multiple: true
      - name: Attach packages to the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mapfile -d '' files < <(find artifacts -type f \( -name '*.dmg' -o -name '*.zip' -o -name '*.exe' \) -print0)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No desktop packages found."
            exit 1
          fi
          printf 'Publishing:\n'
          printf ' - %s\n' "${files[@]}"
          version="${GITHUB_REF_NAME#v}"
          {
            echo "Image Rescaler ${version} is available in the browser and as desktop downloads."
            echo
            echo "**[Open the live workspace](https://aneebji.github.io/img-rescaler/)** — GitHub Pages serves this version from the \`main\` branch."
            echo
            echo "### Downloads"
            echo
            echo "- macOS Apple Silicon: \`.dmg\` and \`.zip\`"
            echo "- Windows 64-bit: installer \`.exe\` and \`.zip\`"
            echo
            echo "The macOS app is ad-hoc signed so Gatekeeper does not report it as damaged. On first launch, allow it in System Settings → Privacy & Security. Windows SmartScreen may warn that the publisher is unknown."
            echo
            echo "Images stay on your device. See the [changelog](https://github.com/aneebji/img-rescaler/blob/main/CHANGELOG.md) for what changed."
          } > release-notes.md
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${files[@]}" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "${files[@]}" \
              --title "Image Rescaler ${version}" \
              --notes-file release-notes.md
          fi
