appId: com.imagerescaler.app
productName: Image Rescaler
directories:
  output: release
files:
  - electron/**/*
  - src/export-utils.mjs
  - dist-renderer/**/*
  - package.json
extraResources:
  - from: src/public/sample.svg
    to: sample.svg
asar: true
asarUnpack:
  - "**/node_modules/sharp/**/*"
  - "**/node_modules/@img/**/*"
npmRebuild: true
mac:
  icon: build/icon.icns
  category: public.app-category.photography
  target:
    - target: dmg
      arch:
        - arm64
    - target: zip
      arch:
        - arm64
  artifactName: Image-Rescaler-${version}-mac-${arch}.${ext}
win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch:
        - x64
    - target: zip
      arch:
        - x64
  artifactName: Image-Rescaler-${version}-win-${arch}.${ext}
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  shortcutName: Image Rescaler
